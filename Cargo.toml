[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
cargo-optic-api = { path = "crates/cargo-optic-api", version = "0.0.1" }
cargo-optic-capture = { path = "crates/cargo-optic-capture", version = "0.0.1" }
cargo-optic-compiler = { path = "crates/cargo-optic-compiler", version = "0.0.1" }
cargo-optic-evidence = { path = "crates/cargo-optic-evidence", version = "0.0.1" }
cargo-optic-records = { path = "crates/cargo-optic-records", version = "0.0.1" }
cargo-optic-store = { path = "crates/cargo-optic-store", version = "0.0.1" }
cargo_metadata = "0.23.1"
clap = { version = "4.5.48", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
snafu = "0.9.2"
tempfile = "3.27.0"
time = { version = "0.3.44", features = ["formatting"] }
uuid = { version = "1.18.1", features = ["v4"] }
