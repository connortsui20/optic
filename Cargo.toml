[workspace]
members = ["crates/*"]
default-members = ["crates/cargo_optic"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/<placeholder>/optic"

[workspace.dependencies]
optic_capture = { path = "crates/optic_capture", version = "0.0.1" }
optic_compiler = { path = "crates/optic_compiler", version = "0.0.1" }
optic_records = { path = "crates/optic_records", version = "0.0.1" }
optic_store = { path = "crates/optic_store", version = "0.0.1" }
cargo_metadata = "0.23.1"
clap = { version = "4.5.48", features = ["derive"] }
optic = { path = "crates/optic", version = "0.0.1" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
snafu = "0.9.2"
tempfile = "3.27.0"
time = { version = "0.3.44", features = ["formatting"] }
uuid = { version = "1.18.1", features = ["v4"] }

[workspace.lints.clippy]
