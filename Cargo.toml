[workspace]
members = ["crates/*"]
default-members = ["crates/cargo-optic"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/<placeholder>/optic"

[workspace.dependencies]
cargo-ir = { path = "crates/cargo-ir", version = "0.0.1" }

[workspace.lints.clippy]
